<!DOCTYPE html>
<!-- pay-page: melbet kaspi-instruction v1 -->
<html lang="{{ default_locale|default:'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>MELBET — {% if default_locale == 'kk' %}төлем{% else %}оплата{% endif %}</title>
  <style>
    :root {
      --bg: #e8eef3; --card: #fff; --text: #1c2430; --muted: #8b95a3; --line: #e8edf2;
      --teal: #12b7c9; --teal-dark: #0e9aab; --kaspi: #f14635; --warn-bg: #fff3c8;
      --warn-text: #6a5414; --link: #1a8dff; --red: #e11d2e; --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    .frame { width: 100%; max-width: 430px; margin: 0 auto; min-height: 100vh; padding: 14px 12px 28px; }
    .card { background: var(--card); border-radius: var(--radius); padding: 14px 14px 12px; margin-bottom: 10px; }
    .lang { display: flex; justify-content: flex-end; }
    .lang-pill {
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid #dbe3ec; border-radius: 10px;
      padding: 5px 8px 5px 6px; font-size: 13px; color: #3d4654; background: #fff; cursor: pointer;
    }
    .ru-flag { width: 20px; height: 14px; border-radius: 2px; overflow: hidden; display: inline-flex; flex-direction: column; }
    .ru-flag i { flex: 1; display: block; }
    .ru-flag i:nth-child(1) { background: #fff; }
    .ru-flag i:nth-child(2) { background: #0039a6; }
    .ru-flag i:nth-child(3) { background: #d52b1e; }
    .brand-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-top: 6px; }
    .melbet-logo { width: 132px; height: auto; display: block; }
    .melbet-bar { width: 52px; height: 3px; background: var(--teal); border-radius: 2px; margin-top: 5px; }
    .pay-id { font-size: 11px; color: var(--muted); text-align: right; line-height: 1.35; }
    .pay-id b { color: #6b7787; font-weight: 500; font-size: 12px; }
    .chip {
      display: inline-flex; align-items: center; gap: 7px; margin: 12px 0 10px;
      background: #1ecad8; color: #fff; border-radius: 999px; padding: 3px 12px 3px 3px;
      font-weight: 800; font-size: 13px;
    }
    .kz-flag { width: 26px; height: 26px; display: block; }
    .pay-line { font-size: 15px; margin: 0 0 12px; color: #3d4654; }
    .pay-line strong { color: var(--teal); }
    .kaspi-box { border: 1px solid #eef1f4; border-radius: 14px; padding: 12px 12px 10px; }
    .kaspi-cap { text-align: center; font-size: 13px; color: #5b6570; margin-bottom: 10px; }
    .kaspi, a.kaspi {
      width: 100%; border: 0; border-radius: 12px; cursor: pointer; text-decoration: none;
      background: var(--kaspi); color: #fff;
      display: grid; grid-template-columns: 54px 1px 1fr; align-items: center; gap: 0;
      padding: 7px 12px 7px 6px; font-size: 16px; font-weight: 700; line-height: 1.15;
    }
    .kaspi-mark { width: 38px; height: 38px; margin: 0 auto; display: block; border-radius: 9px; object-fit: cover; }
    .kaspi-split { width: 1px; height: 32px; background: rgba(255,255,255,.45); justify-self: center; }
    .kaspi > span { text-align: center; width: 100%; }
    .warn {
      margin-top: 10px; background: var(--warn-bg); color: var(--warn-text);
      border-radius: 12px; padding: 11px 12px; font-size: 13px; line-height: 1.4;
      display: flex; gap: 8px; align-items: flex-start;
    }
    .warn-ico {
      width: 22px; height: 22px; border-radius: 50%; background: #f5b400; color: #fff;
      display: grid; place-items: center; font-weight: 800; flex-shrink: 0; font-size: 13px;
    }
    .guide-link {
      width: 100%; margin: 0 0 10px; border: 0; background: #fff; color: var(--link);
      font-size: 16px; font-weight: 700; padding: 14px 16px; border-radius: 14px;
      display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }
    .req { padding: 8px 14px 10px; border: 1.5px solid #3ad4e4; border-radius: 18px; background: #fff; }
    .req-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 4px; border-bottom: 1px solid var(--line); }
    .req-row:last-child { border-bottom: 0; }
    .req-label { font-size: 13px; color: var(--muted); margin-bottom: 3px; }
    .req-val { font-size: 16px; font-weight: 700; word-break: break-all; }
    .visa { color: #1a56db; font-style: italic; font-weight: 800; margin-left: 6px; }
    .copy { width: 34px; height: 34px; border: 0; background: transparent; color: #9aa6b4; cursor: pointer; }
    .timer { display: flex; justify-content: space-between; align-items: center; padding: 6px 6px 14px; color: var(--muted); font-size: 14px; }
    .timer.expired { color: var(--red); }
    .timer-value { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 700; }
    .paid { width: 100%; border: 0; border-radius: 14px; cursor: pointer; background: var(--teal); color: #fff; font-size: 17px; font-weight: 700; padding: 15px; }
    .paid:disabled { opacity: .5; }
    .problems { text-align: center; color: var(--muted); margin: 16px 0 4px; font-size: 15px; }
    .faq { width: 100%; border: 0; background: transparent; text-align: left; padding: 12px 8px; display: flex; gap: 10px; font-size: 15px; color: var(--link); cursor: pointer; }
    .faq-body { display: none; padding: 0 12px 12px 40px; color: #5b6776; font-size: 13px; line-height: 1.45; }
    .faq-wrap.open .faq-body { display: block; }
    .cancel { width: 100%; border: 0; background: transparent; color: var(--red); font-size: 15px; font-weight: 600; padding: 12px; cursor: pointer; }
    .safe { text-align: center; color: #9aa6b4; font-size: 13px; padding: 6px 0 8px; }
    .hidden { display: none !important; }
    .state { text-align: center; padding: 48px 16px; }
    .spinner { width: 36px; height: 36px; border: 3px solid #dbe3ec; border-top-color: var(--teal); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .receipt-box { margin: 12px 0; padding: 12px; border: 1px dashed #dbe3ec; border-radius: 12px; }
    .overlay {
      position: fixed; inset: 0; z-index: 50; display: none;
      background: rgba(20,28,38,.45); align-items: flex-end; justify-content: center; padding: 0;
    }
    .overlay.show { display: flex; }
    .ov-panel {
      width: min(430px, 100%); background: #fff; border-radius: 20px 20px 0 0;
      padding: 16px 14px 18px; position: relative; max-height: 96vh; overflow: auto;
    }
    .ov-head h2 { margin: 0 36px 0 0; font-size: 20px; font-weight: 800; line-height: 1.25; }
    .ov-sub { color: #8b95a3; font-size: 14px; margin: 6px 0 12px; }
    .ov-x {
      position: absolute; top: 12px; right: 12px; z-index: 2; border: 0; background: transparent;
      font-size: 28px; color: #6b7787; cursor: pointer; line-height: 1;
    }
    .id-copy { border: 0; background: none; color: #b0bac4; cursor: pointer; padding: 0 0 0 4px; vertical-align: middle; }
    .paid { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .faq { align-items: center; }
    .faq .chev { margin-left: auto; opacity: .7; }
    .banner-swipe {
      position: relative; aspect-ratio: 3 / 4; touch-action: pan-y; user-select: none;
      overflow: hidden; border-radius: 16px; background: #0b3a9e; cursor: grab;
    }
    .banner-swipe img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; object-position: center; pointer-events: none;
    }
    .arr {
      position: absolute; top: 49%; transform: translateY(-50%);
      width: 42px; height: 42px; border: 0; border-radius: 50%;
      background: #fff; color: #2f7bff; font-size: 22px; line-height: 1;
      box-shadow: 0 4px 14px rgba(15,35,80,.18);
      cursor: pointer; z-index: 3; padding: 0 0 2px;
      display: grid; place-items: center;
    }
    .arr-l { left: 10px; } .arr-r { right: 10px; }
    .arr:disabled { opacity: .38; pointer-events: none; }
    .dots { display: flex; justify-content: center; gap: 6px; padding: 12px 0 10px; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: #d5dde6; display: block; }
    .dots i.on { background: #1a8dff; width: 16px; border-radius: 4px; }
    .ov-nav { display: flex; gap: 10px; }
    .ov-back, .ov-next {
      flex: 1; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .ov-back { background: #eef1f4; color: #5b6570; }
    .ov-back:disabled { opacity: .45; cursor: default; }
    .ov-next { background: #1a8dff; color: #fff; }
    @media (hover: hover) {
      .kaspi:hover, a.kaspi:hover { filter: brightness(1.05); }
      .paid:hover { background: var(--teal-dark); }
      .copy:hover { color: var(--teal); }
    }
    @media (min-width: 768px) {
      body { background: #c9d3de; background-image: radial-gradient(ellipse 80% 45% at 50% 0%, #eef3f8, #c9d3de); }
      .frame { max-width: 980px; padding: 28px 24px 40px; }
      .desk { display: grid; grid-template-columns: 1.05fr .95fr; gap: 12px; align-items: start; }
      .desk-side { background: #fff; border-radius: 18px; padding: 8px 14px 12px; }
      .overlay { align-items: center; padding: 16px; }
      .ov-panel { border-radius: 20px; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div id="app">
      <div class="state" id="loading"><div class="spinner"></div><p id="txt-loading"></p></div>

      ru: {
        loading: "Загрузка платежа…", nav: "Пополнение счёта",
        timer: "Осталось времени:", card: "Номер карты для перевода", phone: "Телефон", account: "Счёт",
        payLink: "Ссылка для оплаты", owner: "Имя получателя", bank: "Банк получателя", bic: "БИК",
        amountExact: "Точная сумма перевода",
        copy: "Копировать", copied: "Скопировано", copyAll: "Скопировать всё",
        hint: "Обратите внимание: сумму перевода указывайте в долларах США ($), чтобы избежать блокировок.",
        kaspiCap: "Нажмите для быстрой оплаты через банк",
        payOne: "одним платежом",
        sent: "Я оплатил", cancel: "✕  Отменить заявку", cancelConfirm: "Отменить заявку?",
        waitTitle: "Ожидаем подтверждение", waitMsg: "Платёж принят. Можно закрыть страницу.",
        waitVerify: "Платёж проверяется.",
        okTitle: "Оплата успешна", okMsg: "Перенаправляем на сайт магазина…",
        failTitle: "Платёж не выполнен", failDeclined: "Платёж отклонён", failMsg: "Перенаправляем…",
        noReq: "Реквизиты временно недоступны", notFound: "Платёж не найден",
        noReqTitle: "Платёж недоступен", noReqMsg: "Реквизиты не выданы.",
        sentErr: "Не удалось подтвердить оплату", cancelErr: "Ошибка отмены",
        bankSection: "Приложение банка",
        receiptLabel: "Чек об оплате", receiptHint: "Загрузите чек, затем нажмите «Я оплатил».",
        receiptRequired: "Сначала прикрепите чек", receiptUploaded: "Чек прикреплён",
        guide: "Пошаговая инструкция", problems: "Возникли проблемы?",
        faq1q: "Я отправил неправильную сумму", faq1a: "Сверьте сумму на экране. Если отправили меньше — дошлите разницу тем же реквизитам.",
        faq2q: "Я не понимаю, как платить", faq2a: "Откройте инструкцию: Переводы → Международные переводы → карта, имя латиницей, сумма в $.",
        safe: "Все платежи защищены", lang: "Русский ▾",
        ovH: "Как выполнить перевод",
        ovBack: "Назад", ovNext: "Далее", ovDone: "Готово",
        ovStep: "Шаг {n} из 3",
      },
    };

    function t(k) { return (I18N[locale] || I18N.ru)[k] || k; }
    function obtainUrl() { return `${API_BASE}/api/v1/payments/in/invoice/${PAY_IN_ID}/obtain/?lang=${locale}`; }
    function apiHeaders() {
      const h = { Accept: "application/json" };
      if (CLIENT_GATE) h.GATE = CLIENT_GATE;
      return h;
    }
    function show(id) {
      ["loading", "error", "pay-screen", "wait-screen", "success-screen", "fail-screen"].forEach(el => {
        document.getElementById(el).classList.toggle("hidden", el !== id);
      });
    }
    function applyStaticI18n() {
      document.documentElement.lang = locale;
      document.getElementById("lang-kk").classList.toggle("active", locale === "kk");
      document.getElementById("lang-ru").classList.toggle("active", locale === "ru");
      document.getElementById("txt-loading").textContent = t("loading");
      document.getElementById("txt-timer-label").textContent = t("timer");
      const hint = t("hint").replace("Обратите внимание:", "<b>Обратите внимание:</b>").replace("Назар аударыңыз:", "<b>Назар аударыңыз:</b>");
      document.getElementById("txt-hint").innerHTML = '<span class="warn-ico">!</span><div>' + hint + "</div>";
      document.getElementById("btn-sent").innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#fff" stroke-width="2"/><path d="M8 12.5l2.5 2.5L16 9.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg> ' + t("sent");
      document.getElementById("btn-cancel").textContent = t("cancel");
      document.getElementById("txt-wait-title").textContent = t("waitTitle");
      document.getElementById("txt-wait-msg").textContent = t("waitMsg");
      document.getElementById("txt-ok-title").textContent = t("okTitle");
      document.getElementById("txt-ok-msg").textContent = t("okMsg");
      document.getElementById("open-guide").innerHTML = t("guide") + " <span>›</span>";
      document.getElementById("txt-problems").textContent = t("problems");
      document.getElementById("faq1-q").textContent = t("faq1q");
      document.getElementById("faq1-a").textContent = t("faq1a");
      document.getElementById("faq2-q").textContent = t("faq2q");
      document.getElementById("faq2-a").textContent = t("faq2a");
      document.getElementById("txt-safe").textContent = t("safe");
      document.getElementById("lang-label").textContent = t("lang");
      document.getElementById("kaspi-cap").textContent = t("kaspiCap");
      document.getElementById("ov-h").textContent = t("ovH");
    }
    function updateSentButtonState() {
      const btn = document.getElementById("btn-sent");
      if (!receiptRequired) { btn.disabled = false; return; }
      btn.disabled = !(receiptUploaded || selectedReceiptFile);
    }
    function setupReceiptUi(data) {
      receiptRequired = Boolean(data.receipt_required);
      receiptUploaded = Boolean(data.receipt_uploaded);
      const box = document.getElementById("receipt-box");
      const fileInput = document.getElementById("receipt-file");
      const nameEl = document.getElementById("receipt-name");
      if (!receiptRequired) {
        box.classList.add("hidden");
        selectedReceiptFile = null;
        updateSentButtonState();
        return;
      }
      box.classList.remove("hidden");
      document.getElementById("txt-receipt-label").textContent = t("receiptLabel");
      document.getElementById("txt-receipt-hint").textContent = t("receiptHint");
      if (receiptUploaded) {
        nameEl.textContent = t("receiptUploaded");
        nameEl.classList.remove("hidden");
        fileInput.classList.add("hidden");
      } else {
        nameEl.classList.add("hidden");
        fileInput.classList.remove("hidden");
        selectedReceiptFile = null;
      }
      updateSentButtonState();
    }
    function pageTransfer(data) {
      if (data.transfer_amount != null && data.transfer_amount !== "" && data.transfer_currency) {
        return { amount: data.transfer_amount, currency: data.transfer_currency };
      }
      if (data.usd_amount != null && Number(data.usd_amount) > 0) {
        return { amount: data.usd_amount, currency: "USD" };
      }
      return { amount: data.amount, currency: data.currency || "KZT" };
    }
    function fmtAmount(amount, currency) {
      const cur = (currency || "").toUpperCase();
      if (cur === "USD") {
        const n = Number(amount);
        return `${Number.isFinite(n) ? n.toFixed(2) : amount} USD`;
      }
      const loc = locale === "kk" ? "kk-KZ" : "ru-RU";
      return `${Number(amount).toLocaleString(loc)} ${currency || ""}`.trim();
    }
    function copyAmountText(amount, currency) {
      if ((currency || "").toUpperCase() === "USD") {
        const n = Number(amount);
        return Number.isFinite(n) ? n.toFixed(2) : String(amount);
      }
      return String(amount);
    }
    function attrEscape(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }
    function detailField(label, value, copyable, extra, copyText) {
      if (!value) return "";
      const id = "f-" + Math.random().toString(36).slice(2, 8);
      const payload = copyText != null ? copyText : value;
      return `<div class="req-row"><div><div class="req-label">${label}</div>
        <div class="req-val" id="${id}">${value}${extra || ""}</div></div>
        ${copyable ? `<button type="button" class="copy" data-target="${id}" data-copy="${attrEscape(payload)}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M4 16V6a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="1.8"/></svg></button>` : ""}</div>`;
    }
    function renderDetails(pd, amountLine, amountCopy) {
      if (!pd || typeof pd !== "object") return `<p>${t("noReq")}</p>`;
      let html = "";
      const visa = (pd.card_number || "").replace(/\s/g, "").startsWith("4") ? '<span class="visa">VISA</span>' : "";
      if (pd.bank) html += detailField(t("bank"), pd.bank, true, visa);
      if (pd.owner) html += detailField(t("owner"), pd.owner, true);
      if (pd.card_number) html += detailField(t("card"), pd.card_number, true);
      if (pd.phone) html += detailField(t("phone"), pd.phone, true);
      if (pd.deposit_number) html += detailField(t("account"), pd.deposit_number, true);
      const hasH2h = Boolean(pd.card_number || pd.phone || pd.deposit_number);
      if (!hasH2h && pd.qr_image_url && /^https?:\/\//i.test(pd.qr_image_url)) {
        html += `<img alt="QR" src="${pd.qr_image_url}" style="max-width:220px">`;
      }
      if (!hasH2h && pd.payment_form_url && /^https?:\/\//i.test(pd.payment_form_url)) {
        html += `<a class="kaspi" href="${pd.payment_form_url}" rel="noopener noreferrer">${t("payLink")}</a>`;
      }
      if (amountLine) html += detailField(t("amountExact"), amountLine, true, "", amountCopy);
      if (pd.bic) html += detailField(t("bic"), pd.bic, true);
      return html || `<p>${t("noReq")}</p>`;
    }
    function guideImageSrc(guide) { return (guide && guide.image_url) || ""; }
    function renderBankGuides() {}
    function isAndroid() { return /android/i.test(navigator.userAgent || ""); }
    function copyClipboardQuiet(text) {
      if (!text || !navigator.clipboard) return;
      navigator.clipboard.writeText(text).catch(() => {});
    }
    function renderBankActions(data) {
      const box = document.getElementById("bank-actions");
      box.innerHTML = "";
      const actions = data.bank_actions || [];
      const kaspi = actions.find(a => (a.id || "").toLowerCase().includes("kaspi")) || actions[0];
      if (!kaspi) return;
      const httpsUrl = kaspi.url || "";
      const androidUrl = kaspi.android_url || "";
      const useAndroidIntent = isAndroid() && androidUrl;
      const useNativeLink = !useAndroidIntent && /^https:\/\//i.test(httpsUrl);
      const mark = `<img class="kaspi-mark" src="/payment-page-assets/kaspi-mark.png" alt="Kaspi"><span class="kaspi-split"></span>`;
      const label = `<span>${kaspi.label || (locale === "kk" ? "Kaspi Bank арқылы төлеу" : "Оплатить через<br>Kaspi Bank")}</span>`;
      if (useNativeLink) {
        const el = document.createElement("a");
        el.className = "kaspi";
        el.href = httpsUrl;
        el.innerHTML = mark + label;
        el.addEventListener("pointerdown", () => copyClipboardQuiet(data.clipboard_text));
        box.appendChild(el);
      } else {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "kaspi";
        el.innerHTML = mark + label;
        el.addEventListener("click", async () => {
          if (data.clipboard_text) {
            try { await navigator.clipboard.writeText(data.clipboard_text); } catch (_) {}
          }
          if (httpsUrl || androidUrl) window.location.href = useAndroidIntent ? androidUrl : httpsUrl;
        });
        box.appendChild(el);
      }
    }
    function wireCopyButtons() {
      document.querySelectorAll(".copy").forEach(btn => {
        btn.onclick = () => {
          if (btn.dataset.copy) {
            navigator.clipboard.writeText(btn.dataset.copy);
            return;
          }
          const el = document.getElementById(btn.dataset.target);
          navigator.clipboard.writeText((el ? el.textContent : "").replace("VISA", "").trim());
        };
      });
    }
    function startCountdown(expiresAt) {
      clearInterval(countdownTimer);
      const box = document.getElementById("timer-box");
      const el = document.getElementById("timer");
      function tick() {
        const left = expiresAt - Math.floor(Date.now() / 1000);
        if (left <= 0) {
          el.textContent = "00:00";
          box.classList.add("expired");
          clearInterval(countdownTimer);
          return;
        }
        const m = Math.floor(left / 60), s = left % 60;
        el.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      }
      tick();
      countdownTimer = setInterval(tick, 1000);
    }
    function markSent() { sessionStorage.setItem(SENT_KEY, "1"); }
    function wasSent() { return sessionStorage.getItem(SENT_KEY) === "1"; }
    function shouldStayOnWait(data) {
      return data.waiting_confirmation || data.pending_verification || wasSent();
    }
    function handleTerminal(data) {
      if (data.status === "Success") {
        clearInterval(pollTimer);
        sessionStorage.removeItem(SENT_KEY);
        show("success-screen");
        if (data.success_url) window.location.href = data.success_url;
        return true;
      }
      if (data.status === "Failed" || data.status === "Declined") {
        if (shouldStayOnWait(data)) {
          show("wait-screen");
          document.getElementById("txt-wait-msg").textContent = t("waitVerify");
          startPolling();
          return true;
        }
        clearInterval(pollTimer);
        sessionStorage.removeItem(SENT_KEY);
        show("fail-screen");
        document.getElementById("fail-title").textContent =
          data.status === "Declined" ? t("failDeclined") : t("failTitle");
        document.getElementById("fail-msg").textContent = t("failMsg");
        if (data.failed_url) window.location.href = data.failed_url;
        return true;
      }
      return false;
    }
    function renderPay(data) {
      if (data.locale) locale = data.locale;
      applyStaticI18n();
      if (handleTerminal(data)) return;
      if (data.waiting_confirmation || data.pending_verification || wasSent()) {
        show("wait-screen");
        startPolling();
        return;
      }
      if (data.requisites_available === false) {
        show("fail-screen");
        document.getElementById("fail-title").textContent = t("noReqTitle");
        document.getElementById("fail-msg").textContent = t("noReqMsg");
        if (data.failed_url) window.location.href = data.failed_url;
        return;
      }
      show("pay-screen");
      const xfer = pageTransfer(data);
      const amt = fmtAmount(xfer.amount, xfer.currency);
      document.getElementById("amount-line").innerHTML = `${locale === "kk" ? "Төлеңіз" : "Оплатите"} <strong>${amt}</strong> ${t("payOne")}`;
      document.getElementById("ps-line").textContent = data.payment_system || "";
      document.getElementById("cur-chip").textContent = data.currency || "KZT";
      document.getElementById("pid").textContent = (PAY_IN_ID || "").slice(0, 6) + "…" + (PAY_IN_ID || "").slice(-4);
      const pidCopy = document.getElementById("pid-copy");
      if (pidCopy) pidCopy.onclick = () => navigator.clipboard.writeText(PAY_IN_ID || "");
      document.getElementById("details").innerHTML = renderDetails(
        data.payment_details, amt, copyAmountText(xfer.amount, xfer.currency)
      );
      renderBankGuides(data);
      renderBankActions(data);
      setupReceiptUi(data);
      wireCopyButtons();
      if (data.expires_at) startCountdown(data.expires_at);
    }
    async function fetchObtain() {
      const res = await fetch(obtainUrl(), { headers: apiHeaders() });
      if (!res.ok) throw new Error(t("notFound"));
      return res.json();
    }
    async function load() {
      applyStaticI18n();
      try { renderPay(await fetchObtain()); }
      catch (e) { show("error"); document.getElementById("error").textContent = e.message || t("notFound"); }
    }
    function startPolling() {
      clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const data = await fetchObtain();
          if (handleTerminal(data)) return;
          if (shouldStayOnWait(data)) return;
          renderPay(data);
        } catch (_) {}
      }, 3000);
    }
    function steps() { return STEPS[locale] || STEPS.ru; }
    function renderGuide() {
      const s = steps()[guideStep];
      document.getElementById("ov-img").src = s.img;
      document.getElementById("ov-sub").textContent = t("ovStep").replace("{n}", String(guideStep + 1));
      document.getElementById("ov-back").textContent = t("ovBack");
      document.getElementById("ov-back").disabled = guideStep === 0;
      document.getElementById("ov-arr-l").disabled = guideStep === 0;
      document.getElementById("ov-next").textContent = guideStep === 2 ? t("ovDone") : t("ovNext");
      document.querySelectorAll("#ov-dots i").forEach((d, i) => d.classList.toggle("on", i === guideStep));
    }
    function guidePrev() { if (guideStep > 0) { guideStep--; renderGuide(); } }
    function guideNext() {
      if (guideStep < 2) { guideStep++; renderGuide(); }
      else document.getElementById("overlay").classList.remove("show");
    }
    document.getElementById("open-guide").onclick = () => { guideStep = 0; renderGuide(); document.getElementById("overlay").classList.add("show"); };
    document.getElementById("close-guide").onclick = () => document.getElementById("overlay").classList.remove("show");
    document.getElementById("ov-back").onclick = guidePrev;
    document.getElementById("ov-next").onclick = guideNext;
    document.getElementById("ov-arr-l").onclick = (e) => { e.stopPropagation(); guidePrev(); };
    document.getElementById("ov-arr-r").onclick = (e) => { e.stopPropagation(); guideNext(); };
    (function bindSwipe() {
      const el = document.getElementById("banner-swipe");
      let x0 = null;
      el.addEventListener("pointerdown", (e) => { x0 = e.clientX; });
      el.addEventListener("pointerup", (e) => {
        if (x0 == null || e.target.closest(".arr")) { x0 = null; return; }
        const dx = e.clientX - x0;
        x0 = null;
        if (dx > 48) guidePrev();
        else if (dx < -48) guideNext();
      });
      el.addEventListener("pointercancel", () => { x0 = null; });
    })();
    document.querySelectorAll(".faq").forEach((btn) => {
      btn.onclick = () => btn.parentElement.classList.toggle("open");
    });
    document.getElementById("lang-toggle").onclick = () => {
      locale = locale === "ru" ? "kk" : "ru";
      localStorage.setItem(`pay_locale_${PAY_IN_ID}`, locale);
      load();
    };
    document.getElementById("receipt-file").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      selectedReceiptFile = file || null;
      const nameEl = document.getElementById("receipt-name");
      if (selectedReceiptFile) { nameEl.textContent = selectedReceiptFile.name; nameEl.classList.remove("hidden"); }
      else nameEl.classList.add("hidden");
      updateSentButtonState();
    });
    document.getElementById("btn-sent").onclick = async () => {
      const btn = document.getElementById("btn-sent");
      if (receiptRequired && !receiptUploaded && !selectedReceiptFile) { alert(t("receiptRequired")); return; }
      btn.disabled = true;
      try {
        let res;
        if (selectedReceiptFile) {
          const form = new FormData();
          form.append("file", selectedReceiptFile);
          res = await fetch(`${API_BASE}/api/v1/payments/in/invoice/${PAY_IN_ID}/sent/`, { method: "POST", headers: apiHeaders(), body: form });
        } else {
          res = await fetch(`${API_BASE}/api/v1/payments/in/invoice/${PAY_IN_ID}/sent/`, { method: "POST", headers: apiHeaders() });
        }
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.details || err.error || t("sentErr"));
        }
        markSent();
        show("wait-screen");
        startPolling();
      } catch (e) { alert(e.message); }
      finally { updateSentButtonState(); }
    };
    document.getElementById("btn-cancel").onclick = async () => {
      if (!confirm(t("cancelConfirm"))) return;
      try {
        const res = await fetch(`${API_BASE}/api/v1/payments/in/invoice/${PAY_IN_ID}/cancel/`, { method: "POST", headers: apiHeaders() });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.details || data.error || t("cancelErr"));
        sessionStorage.removeItem(SENT_KEY);
        const fresh = await fetchObtain();
        handleTerminal({ ...fresh, status: "Failed", failed_url: fresh.failed_url });
      } catch (e) { alert(e.message); }
    };
    document.getElementById("lang-kk").onclick = () => { locale = "kk"; localStorage.setItem(`pay_locale_${PAY_IN_ID}`, "kk"); load(); };
    document.getElementById("lang-ru").onclick = () => { locale = "ru"; localStorage.setItem(`pay_locale_${PAY_IN_ID}`, "ru"); load(); };
    load();
  </script>
</body>
</html>
