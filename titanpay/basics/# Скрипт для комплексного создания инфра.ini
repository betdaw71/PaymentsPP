@transaction.atomic
def create_infrastructure():
    """Создание всей инфраструктуры в одной транзакции"""
    
    created_objects = {}
    
    try:
        print("="*60)
        print("НАЧАЛО СОЗДАНИЯ ИНФРАСТРУКТУРЫ UZS")
        print("="*60)
        
        # 1. Получаем или создаем язык по умолчанию
        language, created = Language.objects.get_or_create(
            name='English',
            defaults={'id': uuid.uuid4()}
        )
        if created:
            print(f"Создан язык: {language.name}")
        created_objects['language'] = language
        
        # 2. Создаем валюту UZS
        currency = Currency.objects.create(
            id=uuid.uuid4(),
            name=SETTINGS['currency']['name'],
            symbol=SETTINGS['currency']['symbol']
        )
        print(f"Создана валюта: {currency.name} ({currency.symbol})")
        created_objects['currency'] = currency
        
        # 3. Создаем платежные системы
        created_objects['payment_systems'] = {}
        for ps_data in SETTINGS['payment_systems']:
            ps_name = ps_data['name']
            
            # Объединяем настройки
            ps_settings = SETTINGS['default_ps_settings'].copy()
            ps_settings.update({
                'id': uuid.uuid4(),
                'name': ps_name,
                'currency': currency,
                'usdt_exchange_rate': ps_data['usdt_exchange_rate']
            })
            
            # Создаем платежную систему
            payment_system = PaymentSystem.objects.create(**ps_settings)
            created_objects['payment_systems'][ps_name] = payment_system
            print(f"Создана платежная система: {ps_name}")
        
        # 4. Получаем или создаем тип трафика
        traffic_type, created = TrafficType.objects.get_or_create(
            name=SETTINGS['default_traffic_type'],
            defaults={
                'id': uuid.uuid4(),
                'risk_level': 0
            }
        )
        if created:
            print(f"Создан тип трафика: {traffic_type.name}")
        created_objects['traffic_type'] = traffic_type
        
        # 5. Создаем мерчанта kommerzz
        print("\n" + "-"*40)
        print("СОЗДАНИЕ МЕРЧАНТА KOMMERZZ")
        print("-"*40)
        
        # Создаем пользователя для мерчанта
        merchant_user = User.objects.create_user(
            username=SETTINGS['merchant']['username'],
            email=SETTINGS['merchant']['email'],
            password=SETTINGS['merchant']['password']
        )
        
        # Создаем балансы
        merchant_balance = Balance.objects.create(
            id=uuid.uuid4(),
            type=0,
            amount=Decimal('0')
        )
        
        merchant_frozen_balance = Balance.objects.create(
            id=uuid.uuid4(),
            type=1,
            amount=Decimal('0')
        )
        
        # Создаем мерчанта
        merchant = Merchant.objects.create(
            id=uuid.uuid4(),
            user=merchant_user,
            balance=merchant_balance,
            frozen_balance=merchant_frozen_balance,
            language=language,
            telegram=SETTINGS['merchant']['telegram'],
            phone=SETTINGS['merchant']['phone']
        )
        
        # Добавляем все платежные системы
        merchant.payment_systems.set(created_objects['payment_systems'].values())
        created_objects['merchant'] = merchant
        print(f"Создан мерчант: {merchant.user.username}")
        
        # 6. Создаем MerchantSolution для каждой платежной системы
        created_objects['merchant_solutions'] = []
        for ps_name, payment_system in created_objects['payment_systems'].items():
            # Определяем MDR ставки
            mdr_rates = SETTINGS['mdr_rates']['specific'].get(
                ps_name, 
                SETTINGS['mdr_rates']['default']
            )
            
            solution = MerchantSolution.objects.create(
                id=uuid.uuid4(),
                status=1,
                payment_system=payment_system,
                merchant=merchant,
                mdr_in=mdr_rates['mdr_in'],
                mdr_out=mdr_rates['mdr_out'],
                traffic=traffic_type,
                ftd=True,
                autoclose_arbitrage=True,
                min_limit_in=Decimal('1000.00'),
                min_limit_out=Decimal('1000.00'),
                max_limit_in=Decimal('1000000.00'),
                max_limit_out=Decimal('1000000.00')
            )
            created_objects['merchant_solutions'].append(solution)
        
        print(f"Создано {len(created_objects['merchant_solutions'])} MerchantSolution")
        
        # 7. Создаем тимлида cards_mg
        print("\n" + "-"*40)
        print("СОЗДАНИЕ ТИМЛИДА CARDS_MG")
        print("-"*40)
        
        # Создаем пользователя для тимлида
        teamlead_user = User.objects.create_user(
            username=SETTINGS['teamlead']['username'],
            email=SETTINGS['teamlead']['email'],
            password=SETTINGS['teamlead']['password']
        )
        
        # Создаем баланс для тимлида
        teamlead_balance = Balance.objects.create(
            id=uuid.uuid4(),
            type=0,
            amount=Decimal('0')
        )
        
        # Создаем тимлида
        teamlead = TeamLead.objects.create(
            id=uuid.uuid4(),
            user=teamlead_user,
            balance=teamlead_balance,
            language=language,
            telegram=SETTINGS['teamlead']['telegram'],
            phone=SETTINGS['teamlead']['phone']
        )
        created_objects['teamlead'] = teamlead
        print(f"Создан тимлид: {teamlead.user.username}")
        
        # 8. Создаем команду трейдеров FulmineSet
        print("\n" + "-"*40)
        print("СОЗДАНИЕ КОМАНДЫ ТРЕЙДЕРОВ")
        print("-"*40)
        
        trader_team = TraderTeam.objects.create(
            id=uuid.uuid4(),
            name=SETTINGS['trader_team']['name'],
            rate_in=SETTINGS['trader_team']['rate_in'],
            rate_out=SETTINGS['trader_team']['rate_out'],
            teamlead=teamlead,
            teamlead_percentage=SETTINGS['trader_team']['teamlead_percentage'],
            insurance_deposit=SETTINGS['trader_team']['insurance_deposit']
        )
        created_objects['trader_team'] = trader_team
        print(f"Создана команда трейдеров: {trader_team.name}")
        
        # 9. Создаем TraderTeamRates для каждой платежной системы
        created_objects['trader_team_rates'] = []
        for ps_name, payment_system in created_objects['payment_systems'].items():
            # Определяем MDR ставки
            mdr_rates = SETTINGS['mdr_rates']['specific'].get(
                ps_name, 
                SETTINGS['mdr_rates']['default']
            )
            
            team_rate = TraderTeamRates.objects.create(
                id=uuid.uuid4(),
                team=trader_team,
                payment_system=payment_system,
                mdr_in=mdr_rates['mdr_in'],
                mdr_out=mdr_rates['mdr_out']
            )
            created_objects['trader_team_rates'].append(team_rate)
        
        print(f"Создано {len(created_objects['trader_team_rates'])} TraderTeamRates")
        
        # 10. Создаем трейдера FulmineSet
        print("\n" + "-"*40)
        print("СОЗДАНИЕ ТРЕЙДЕРА FULMINESET")
        print("-"*40)
        
        # Создаем пользователя для трейдера
        trader_user = User.objects.create_user(
            username=SETTINGS['trader']['username'],
            email=SETTINGS['trader']['email'],
            password=SETTINGS['trader']['password']
        )
        
        # Создаем балансы для трейдера
        trader_balance = Balance.objects.create(
            id=uuid.uuid4(),
            type=0,
            amount=Decimal('0')
        )
        
        trader_frozen_balance = Balance.objects.create(
            id=uuid.uuid4(),
            type=1,
            amount=Decimal('0')
        )
        
        # Создаем трейдера
        trader = Trader.objects.create(
            id=uuid.uuid4(),
            user=trader_user,
            language=language,
            telegram=SETTINGS['trader']['telegram'],
            phone=SETTINGS['trader']['phone'],
            boss=None,
            is_boss=SETTINGS['trader']['is_boss'],
            team=trader_team,
            balance_usdt=trader_balance,
            frozen_balance_usdt=trader_frozen_balance,
            currency=currency,
            blocked=False,
            super_blocked=False
        )
        created_objects['trader'] = trader
        print(f"Создан трейдер: {trader.user.username}")
        print(f"Трейдер является боссом: {trader.is_boss}")
        
        # 11. Итоговая информация
        print("\n" + "="*60)
        print("ИНФРАСТРУКТУРА УСПЕШНО СОЗДАНА!")
        print("="*60)
        print(f"\nСоздано объектов:")
        print(f"- Валют: 1 ({currency.name})")
        print(f"- Платежных систем: {len(created_objects['payment_systems'])}")
        print(f"- Мерчант: {merchant.user.username}")
        print(f"- Тимлид: {teamlead.user.username}")
        print(f"- Команда трейдеров: {trader_team.name}")
        print(f"- Трейдер: {trader.user.username}")
        print(f"- MerchantSolution: {len(created_objects['merchant_solutions'])}")
        print(f"- TraderTeamRates: {len(created_objects['trader_team_rates'])}")
        
        # 12. Сохраняем информацию для доступа
        print("\n" + "="*60)
        print("ДАННЫЕ ДЛЯ ДОСТУПА:")
        print("="*60)
        print(f"\nМерчант kommerzz:")
        print(f"Логин: {SETTINGS['merchant']['username']}")
        print(f"Пароль: {SETTINGS['merchant']['password']}")
        print(f"ID: {merchant.id}")
        
        print(f"\nТимлид cards_mg:")
        print(f"Логин: {SETTINGS['teamlead']['username']}")
        print(f"Пароль: {SETTINGS['teamlead']['password']}")
        print(f"ID: {teamlead.id}")
        
        print(f"\nТрейдер FulmineSet:")
        print(f"Логин: {SETTINGS['trader']['username']}")
        print(f"Пароль: {SETTINGS['trader']['password']}")
        print(f"ID: {trader.id}")
        
        print(f"\nКоманда трейдеров:")
        print(f"Название: {trader_team.name}")
        print(f"ID: {trader_team.id}")
        print(f"Ставка IN: {trader_team.rate_in}%")
        print(f"Ставка OUT: {trader_team.rate_out}%")
        
        return created_objects
        
    except Exception as e:
        print(f"\nОШИБКА ПРИ СОЗДАНИИ: {str(e)}")
        print("Все изменения откачены из-за транзакции.")
        raise

# Дополнительные функции для проверки и управления

def check_existence():
    """Проверка существования объектов перед созданием"""
    print("Проверка существующих объектов...")
    
    checks = [
        ('Currency UZS', Currency.objects.filter(name='UZS').exists()),
        ('User kommerzz', User.objects.filter(username='kommerzz').exists()),
        ('User cards_mg', User.objects.filter(username='cards_mg').exists()),
        ('User FulmineSet', User.objects.filter(username='FulmineSet').exists()),
        ('TraderTeam FulmineSet', TraderTeam.objects.filter(name='FulmineSet').exists()),
    ]
    
    for name, exists in checks:
        status = "СУЩЕСТВУЕТ" if exists else "НЕ СУЩЕСТВУЕТ"
        print(f"{name}: {status}")
    
    return any(exists for _, exists in checks)

def get_created_info(created_objects):
    """Получить информацию о созданных объектах"""
    info = {
        'currency': str(created_objects.get('currency')),
        'merchant': {
            'username': created_objects['merchant'].user.username,
            'id': created_objects['merchant'].id
        },
        'teamlead': {
            'username': created_objects['teamlead'].user.username,
            'id': created_objects['teamlead'].id
        },
        'trader_team': {
            'name': created_objects['trader_team'].name,
            'id': created_objects['trader_team'].id
        },
        'trader': {
            'username': created_objects['trader'].user.username,
            'id': created_objects['trader'].id
        }
    }
    return info

# Запуск создания
if __name__ == "__main__":
    print("\nПодготовка к созданию инфраструктуры UZS...")
    
    # Проверяем существование
    if check_existence():
        response = input("\nНекоторые объекты уже существуют. Продолжить? (y/N): ")
        if response.lower() != 'y':
            print("Создание отменено.")
            exit()
    
    # Запускаем создание
    try:
        created = create_infrastructure()
        print("\nГотово! Все объекты созданы успешно.")
    except Exception as e:
        print(f"Произошла ошибка: {e}")