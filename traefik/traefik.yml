api:
  dashboard: true
  debug: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: project_network
    endpoint: "unix:///var/run/docker.sock"
  file:
    filename: /etc/traefik/middlewares.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: abrakadabrattem@yandex.ru
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
